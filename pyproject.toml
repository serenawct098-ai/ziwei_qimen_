[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ziwei-qimen"
version = "0.1.0"
description = "Reproducible Zi Wei Dou Shu and time-based rotating-plate Qi Men Dun Jia system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [
  { name = "serenawct098-ai" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.5",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/ziwei_qimen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers"
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "tools"]
strict = true
warn_unreachable = true
