[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ziwei-qimen"
version = "0.1.0"
description = "Zi Wei Dou Shu and time-based rotating Qi Men Dun Jia engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "tzdata==2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "ruff==0.11.2",
  "mypy==1.15.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
